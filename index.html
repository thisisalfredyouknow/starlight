<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Starlight</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #050817;
            color: white;
            font-family: Arial, Tahoma, sans-serif;
        }
        /* =========================
           NIGHT INTRO
        ========================= */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 10;
            overflow: hidden;
            background:
                linear-gradient(
                    to bottom,
                    #030615 0%,
                    #0b1230 48%,
                    #111936 100%
                );
            animation: introFade 5s forwards;
            pointer-events: none;
        }
        /* Stars */
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(
                    circle,
                    white 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    white 1px,
                    transparent 1px
                ),
                radial-gradient(
                    circle,
                    white 1px,
                    transparent 1px
                );
            background-size:
                150px 150px,
                220px 220px,
                310px 310px;
            background-position:
                20px 30px,
                90px 120px,
                180px 60px;
            opacity: 0.55;
        }
        /* Moon */
        .moon {
            position: absolute;
            width: 145px;
            height: 145px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 35%,
                    #ffffff,
                    #f5f2df 55%,
                    #d8d4bd 100%
                );
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow:
                0 0 25px rgba(255,255,230,0.8),
                0 0 70px rgba(190,210,255,0.35);
            animation:
                moonAppear 3s ease-out forwards;
        }
        /* Ocean */
        .ocean {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48%;
            background:
                linear-gradient(
                    to bottom,
                    #101b3a,
                    #071027
                );
        }
        /* Moon reflection */
        .reflection {
            position: absolute;
            top: 0;
            left: 50%;
            width: 100px;
            height: 100%;
            transform: translateX(-50%);
            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,230,0.35),
                    rgba(255,255,230,0.08),
                    transparent
                );
            filter: blur(10px);
            animation:
                reflectionMove 2.5s ease-in-out infinite;
        }
        /* Waves */
        .wave {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 70px;
            border-radius: 50%;
            border-top:
                2px solid rgba(255,255,255,0.13);
            animation:
                waveMove 5s ease-in-out infinite;
        }
        .wave1 {
            top: 18%;
        }
        .wave2 {
            top: 38%;
            animation-delay: 1s;
            opacity: 0.6;
        }
        .wave3 {
            top: 60%;
            animation-delay: 2s;
            opacity: 0.4;
        }
        .wave4 {
            top: 80%;
            animation-delay: 0.7s;
            opacity: 0.25;
        }
        /* Intro title */
        .introText {
            position: absolute;
            left: 50%;
            top: 65%;
            transform:
                translate(-50%, -50%);
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 34px;
            letter-spacing: 7px;
            direction: ltr;
            opacity: 0;
            animation:
                textAppear 2s 1.5s forwards;
        }
        /* =========================
           LOGIN
        ========================= */
        #loginPage {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation:
                loginAppear 1.5s 4.5s forwards;
        }
        .container {
            width: 90%;
            max-width: 380px;
            padding: 35px;
            background:
                rgba(255,255,255,0.08);
            border:
                1px solid rgba(255,255,255,0.12);
            border-radius: 25px;
            text-align: center;
            backdrop-filter:
                blur(18px);
            box-shadow:
                0 20px 60px rgba(0,0,0,0.45);
        }
        h1 {
            font-size: 38px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            direction: ltr;
            text-align: left;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #171326;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }
        #error {
            color: #ff8f8f;
            margin-top: 15px;
            display: none;
        }
        /* =========================
           SECRET PAGE
        ========================= */
        #secretPage {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #secretPage h1 {
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            font-size: 34px;
            direction: rtl;
            letter-spacing: 0;
            margin-bottom: 25px;
        }
        .heart {
            font-size: 100px;
            direction: ltr;
            animation:
                heartbeat 1.2s infinite;
        }
        /* =========================
           ANIMATIONS
        ========================= */
        @keyframes moonAppear {
            0% {
                transform:
                    translateX(-50%)
                    scale(0.3);
                opacity: 0;
            }
            100% {
                transform:
                    translateX(-50%)
                    scale(1);
                opacity: 1;
            }
        }
        @keyframes reflectionMove {
            0%,
            100% {
                transform:
                    translateX(-50%)
                    scaleX(0.8);
            }
            50% {
                transform:
                    translateX(-50%)
                    scaleX(1.25);
            }
        }
        @keyframes waveMove {
            0%,
            100% {
                transform:
                    translateX(-2%)
                    rotate(0deg);
            }
            50% {
                transform:
                    translateX(2%)
                    rotate(1deg);
            }
        }
        @keyframes textAppear {
            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    translateY(20px);
            }
            100% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    translateY(0);
            }
        }
        @keyframes introFade {
            0%,
            82% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        @keyframes loginAppear {
            0% {
                opacity: 0;
                transform:
                    translateY(25px);
            }
            100% {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }
        @keyframes heartbeat {
            0% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.15);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(1);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- =========================
         NIGHT INTRO
    ========================= -->
    <div id="intro">
        <div class="stars"></div>
        <div class="moon"></div>
        <div class="ocean">
            <div class="reflection"></div>
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
            <div class="wave wave4"></div>
        </div>
        <div class="introText">
            STARLIGHT
        </div>
    </div>
    <!-- =========================
         LOGIN PAGE
    ========================= -->
    <div id="loginPage">
        <div class="container">
            <h1>
                Starlight
            </h1>
            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="off"
            >
            <input
                type="password"
                id="password"
                placeholder="Password"
            >
            <button onclick="login()">
                Enter
            </button>
            <div id="error">
                Wrong username or password.
            </div>
        </div>
    </div>
    <!-- =========================
         SECRET PAGE
    ========================= -->
    <div id="secretPage">
        <div class="container">
            <h1>
                خوش اومدی ❤️
            </h1>
            <div class="heart">
                ❤️
            </div>
        </div>
    </div>
    <!-- =========================
         JAVASCRIPT
    ========================= -->
    <script>
        function login() {
            const username =
                document
                .getElementById("username")
                .value
                .trim();
            const password =
                document
                .getElementById("password")
                .value
                .trim();
            if (
                username === "Starlight" &&
                password === "Starlight"
            ) {
                document
                .getElementById("loginPage")
                .style.display = "none";
                document
                .getElementById("secretPage")
                .style.display = "flex";
                document
                .getElementById("intro")
                .style.display = "none";
            }
            else {
                document
                .getElementById("error")
                .style.display = "block";
            }
        }
        /* Enter key */
        document
        .getElementById("password")
        .addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    login();
                }
            }
        );
    </script>
</body>
</html>
