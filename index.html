<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #050817;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }
        /* =========================
           INTRO
        ========================= */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 10;
            overflow: hidden;
            background:
                linear-gradient(
                    to bottom,
                    #020514 0%,
                    #08132f 48%,
                    #101d3d 100%
                );
            animation: introFade 5s forwards;
            pointer-events: none;
        }
        /* =========================
           STARS
        ========================= */
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(
                    circle,
                    white 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle,
                    white 1px,
                    transparent 1.5px
                ),
                radial-gradient(
                    circle,
                    white 1.5px,
                    transparent 2px
                );
            background-size:
                90px 90px,
                140px 140px,
                220px 220px;
            background-position:
                10px 20px,
                60px 80px,
                120px 40px;
            opacity: 0.75;
            animation: starsMove 8s linear infinite;
        }
        /* =========================
           CUTE STARS
        ========================= */
        .cute-stars {
            position: absolute;
            inset: 0;
        }
        .star {
            position: absolute;
            color: #ffffff;
            font-size: 16px;
            text-shadow:
                0 0 8px rgba(255,255,255,0.9);
            animation:
                twinkle 2s ease-in-out infinite;
        }
        .star1 {
            top: 12%;
            left: 15%;
            animation-delay: 0.2s;
        }
        .star2 {
            top: 25%;
            left: 82%;
            animation-delay: 1s;
        }
        .star3 {
            top: 42%;
            left: 10%;
            animation-delay: 1.7s;
        }
        .star4 {
            top: 18%;
            left: 65%;
            animation-delay: 0.8s;
        }
        .star5 {
            top: 48%;
            left: 88%;
            animation-delay: 1.3s;
        }
        .star6 {
            top: 8%;
            left: 42%;
            animation-delay: 0.5s;
        }
        .star7 {
            top: 35%;
            left: 35%;
            animation-delay: 1.5s;
        }
        .star8 {
            top: 55%;
            left: 72%;
            animation-delay: 0.3s;
        }
        /* =========================
           SCHOOL ICONS
        ========================= */
        .school-icons {
            position: absolute;
            inset: 0;
        }
        .school-icon {
            position: absolute;
            font-size: 27px;
            opacity: 0.85;
            filter:
                drop-shadow(
                    0 0 8px rgba(255,255,255,0.25)
                );
            animation:
                floatIcon 5s ease-in-out infinite;
        }
        .book {
            top: 20%;
            left: 8%;
            animation-delay: 0s;
        }
        .pencil {
            top: 32%;
            right: 9%;
            animation-delay: 1s;
        }
        .graduation {
            top: 45%;
            left: 18%;
            animation-delay: 2s;
        }
        .math {
            top: 18%;
            right: 25%;
            animation-delay: 1.5s;
        }
        .science {
            top: 38%;
            right: 18%;
            animation-delay: 0.7s;
        }
        .notebook {
            top: 50%;
            left: 78%;
            animation-delay: 2.5s;
        }
        .pen {
            top: 12%;
            left: 28%;
            animation-delay: 1.8s;
        }
        .school {
            top: 52%;
            left: 5%;
            animation-delay: 0.8s;
        }
        /* =========================
           MOON
        ========================= */
        .moon {
            position: absolute;
            width: 145px;
            height: 145px;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 35% 35%,
                    #ffffff,
                    #f5f2df 55%,
                    #d8d4bd 100%
                );
            top: 15%;
            left: 50%;
            transform:
                translateX(-50%);
            box-shadow:
                0 0 25px rgba(255,255,230,0.8),
                0 0 70px rgba(190,210,255,0.35);
            animation:
                moonAppear 3s ease-out forwards;
        }
        /* =========================
           OCEAN
        ========================= */
        .ocean {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48%;
            background:
                linear-gradient(
                    to bottom,
                    #101b3a,
                    #071027
                );
        }
        /* Moon reflection */
        .reflection {
            position: absolute;
            top: 0;
            left: 50%;
            width: 100px;
            height: 100%;
            transform:
                translateX(-50%);
            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,230,0.35),
                    rgba(255,255,230,0.08),
                    transparent
                );
            filter: blur(10px);
            animation:
                reflectionMove 2.5s ease-in-out infinite;
        }
        /* Waves */
        .wave {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 70px;
            border-radius: 50%;
            border-top:
                2px solid rgba(255,255,255,0.13);
            animation:
                waveMove 5s ease-in-out infinite;
        }
        .wave1 {
            top: 18%;
        }
        .wave2 {
            top: 38%;
            animation-delay: 1s;
            opacity: 0.6;
        }
        .wave3 {
            top: 60%;
            animation-delay: 2s;
            opacity: 0.4;
        }
        .wave4 {
            top: 80%;
            animation-delay: 0.7s;
            opacity: 0.25;
        }
        /* =========================
           INTRO TITLE
        ========================= */
        .introText {
            position: absolute;
            left: 50%;
            top: 65%;
            transform:
                translate(-50%, -50%);
            text-align: center;
            font-family:
                Arial,
                sans-serif;
            font-size: 34px;
            letter-spacing: 7px;
            direction: ltr;
            opacity: 0;
            animation:
                textAppear 2s 1.5s forwards;
        }
        /* =========================
           LOGIN
        ========================= */
        #loginPage {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation:
                loginAppear 1.5s 4.5s forwards;
        }
        .container {
            width: 90%;
            max-width: 380px;
            padding: 35px;
            background:
                rgba(255,255,255,0.08);
            border:
                1px solid rgba(255,255,255,0.12);
            border-radius: 25px;
            text-align: center;
            backdrop-filter:
                blur(18px);
            box-shadow:
                0 20px 60px rgba(0,0,0,0.45);
        }
        h1 {
            font-size: 38px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            direction: ltr;
            text-align: left;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #171326;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }
        #error {
            color: #ff8f8f;
            margin-top: 15px;
            display: none;
        }
        /* =========================
           SECRET PAGE
        ========================= */
        #secretPage {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #secretPage h1 {
            font-family:
                Tahoma,
                Arial,
                sans-serif;
            font-size: 30px;
            direction: rtl;
            letter-spacing: 0;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .heart {
            font-size: 100px;
            direction: ltr;
            animation:
                heartbeat 1.2s infinite;
        }
        /* =========================
           ANIMATIONS
        ========================= */
        @keyframes moonAppear {
            0% {
                transform:
                    translateX(-50%)
                    scale(0.3);
                opacity: 0;
            }
            100% {
                transform:
                    translateX(-50%)
                    scale(1);
                opacity: 1;
            }
        }
        @keyframes reflectionMove {
            0%,
            100% {
                transform:
                    translateX(-50%)
                    scaleX(0.8);
            }
            50% {
                transform:
                    translateX(-50%)
                    scaleX(1.25);
            }
        }
        @keyframes waveMove {
            0%,
            100% {
                transform:
                    translateX(-2%)
                    rotate(0deg);
            }
            50% {
                transform:
                    translateX(2%)
                    rotate(1deg);
            }
        }
        @keyframes starsMove {
            from {
                transform:
                    translateY(0);
            }
            to {
                transform:
                    translateY(15px);
            }
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.35;
                transform:
                    scale(0.8);
            }
            50% {
                opacity: 1;
                transform:
                    scale(1.3);
            }
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-4deg);
            }
            50% {
                transform:
                    translateY(-18px)
                    rotate(5deg);
            }
        }
        @keyframes textAppear {
            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    translateY(20px);
            }
            100% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    translateY(0);
            }
        }
        @keyframes introFade {
            0%,
            82% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        @keyframes loginAppear {
            0% {
                opacity: 0;
                transform:
                    translateY(25px);
            }
            100% {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }
        @keyframes heartbeat {
            0% {
                transform:
                    scale(1);
            }
            15% {
                transform:
                    scale(1.15);
            }
            30% {
                transform:
                    scale(1);
            }
            45% {
                transform:
                    scale(1.15);
            }
            60% {
                transform:
                    scale(1);
            }
            100% {
                transform:
                    scale(1);
            }
        }
    </style>
</head>
<body>
    <!-- =========================
         NIGHT INTRO
    ========================= -->
    <div id="intro">
        <div class="stars"></div>
        <!-- Cute stars -->
        <div class="cute-stars">
            <div class="star star1">✦</div>
            <div class="star star2">✧</div>
            <div class="star star3">★</div>
            <div class="star star4">✦</div>
            <div class="star star5">✧</div>
            <div class="star star6">★</div>
            <div class="star star7">✦</div>
            <div class="star star8">✧</div>
        </div>
        <!-- School icons -->
        <div class="school-icons">
            <div class="school-icon book">
                📚
            </div>
            <div class="school-icon pencil">
                ✏️
            </div>
            <div class="school-icon graduation">
                🎓
            </div>
            <div class="school-icon math">
                🧮
            </div>
            <div class="school-icon science">
                🔬
            </div>
            <div class="school-icon notebook">
                📓
            </div>
            <div class="school-icon pen">
                🖊️
            </div>
            <div class="school-icon school">
                🏫
            </div>
        </div>
        <!-- Moon -->
        <div class="moon"></div>
        <!-- Ocean -->
        <div class="ocean">
            <div class="reflection"></div>
            <div class="wave wave1"></div>
            <div class="wave wave2"></div>
            <div class="wave wave3"></div>
            <div class="wave wave4"></div>
        </div>
        <div class="introText">
            STARLIGHT
        </div>
    </div>
    <!-- =========================
         LOGIN PAGE
    ========================= -->
    <div id="loginPage">
        <div class="container">
            <h1>
                Starlight
            </h1>
            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="off"
            >
            <input
                type="password"
                id="password"
                placeholder="Password"
            >
            <button onclick="login()">
                Enter
            </button>
            <div id="error">
                Wrong username or password.
            </div>
        </div>
    </div>
    <!-- =========================
         SECRET PAGE
    ========================= -->
    <div id="secretPage">
        <div class="container">
            <h1>
                خوش اومدی به اولین سایت زندگی من 😇❤️
            </h1>
            <div class="heart">
                ❤️
            </div>
        </div>
    </div>
    <!-- =========================
         JAVASCRIPT
    ========================= -->
    <script>
        function login() {
            const username =
                document
                .getElementById("username")
                .value
                .trim();
            const password =
                document
                .getElementById("password")
                .value
                .trim();
            if (
                username === "Starlight" &&
                password === "Starlight"
            ) {
                document
                .getElementById("loginPage")
                .style.display = "none";
                document
                .getElementById("secretPage")
                .style.display = "flex";
                document
                .getElementById("intro")
                .style.display = "none";
            }
            else {
                document
                .getElementById("error")
                .style.display = "block";
            }
        }
        /* Enter key */
        document
        .getElementById("password")
        .addEventListener(
            "keydown",
            function(event) {
                if (event.key === "Enter") {
                    login();
                }
            }
        );
    </script>
</body>
</html>
